name: StarKeyboard
options:
  bundleIdPrefix: com.jibeib
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
targets:
  StarKeyboard:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 星蓝输入法
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
    dependencies:
      - target: StarKeyboardExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jibeib.starkeyboard
        PRODUCT_NAME: StarKeyboard
        INFOPLIST_FILE: App/Info.plist
  StarKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 星蓝输入法
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jibeib.starkeyboard.keyboard
        PRODUCT_NAME: StarKeyboardExtension
        INFOPLIST_FILE: Keyboard/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES

